name: Offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.8'
          enable-cache: true
      - name: Install ffmpeg for media integration tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install locked test dependencies
        run: uv sync --locked --group dev --python ${{ matrix.python }}
      - name: Validate skill metadata and local links
        run: uv run --locked python tools/check_repo.py
      - name: Run offline behavior tests
        run: uv run --locked python -m unittest discover -s anime-pv/scripts/tests -v
